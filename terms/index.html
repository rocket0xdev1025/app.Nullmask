 list is a summary only. The sections below are the agreement.\u003c/p\u003e\n\u003ch2\u003e1. About these Terms\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e1.1 Who we are.\u003c/strong\u003e \u0026quot;NullMask\u0026quot;, \u0026quot;we\u0026quot;, \u0026quot;us\u0026quot; and \u0026quot;our\u0026quot; mean the company that operates the Services (the \u0026quot;Operator\u0026quot;). We will give the Operator's full legal details to any person who needs them to bring or answer a legal claim, and to any competent authority, on written request to \u003ca href=\"mailto:legal@nullmask.io\"\u003elegal@nullmask.io\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.2 The Services.\u003c/strong\u003e The \u0026quot;Services\u0026quot; are the website at nullmask.io, the web application at app.nullmask.io, our documentation, and the servers we run to support them, including the network endpoint your wallet connects to, the screening service and the relayer. The \u0026quot;Pool\u0026quot; is the set of NullMask smart contracts on Ethereum mainnet.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.3 Acceptance.\u003c/strong\u003e You accept these Terms when you confirm them in the application, connect a wallet, or otherwise use the Services. If you do not agree, do not use the Services.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.4 Privacy Policy.\u003c/strong\u003e Our Privacy Policy explains how we handle your data. It forms part of these Terms.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.5 Acting for others.\u003c/strong\u003e If you use the Services for a company or another person, you confirm that you have authority to bind them. \u0026quot;You\u0026quot; then includes them.\u003c/p\u003e\n\u003ch2\u003e2. Who may use the Services\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e2.1 Age and capacity.\u003c/strong\u003e You must be at least 18 years old and legally able to enter into this agreement.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.2 Sanctions.\u003c/strong\u003e You must not be listed on, or owned or controlled by anyone listed on, a sanctions list of the United Nations, the United States, the European Union or the United Kingdom.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.3 Restricted Territories.\u003c/strong\u003e You must not use the Services if you are located in, resident in, a citizen of, or organised in a Restricted Territory. \u0026quot;Restricted Territory\u0026quot; means:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003eCuba, Iran, North Korea and Syria;\u003c/li\u003e\u003cli\u003ethe Crimea, Donetsk and Luhansk regions of Ukraine;\u003c/li\u003e\u003cli\u003ethe United Arab Emirates; and\u003c/li\u003e\u003cli\u003eany other country or territory under comprehensive sanctions of the United Nations, the United States, the European Union or the United Kingdom.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eWe may change this list at any time.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.4 Local law.\u003c/strong\u003e The Services may be unlawful or restricted where you live. You are responsible for checking and following the laws that apply to you.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.5 No circumvention.\u003c/strong\u003e You must not use a VPN, proxy or any other means to hide your location in order to get around this section.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.6 Your statements.\u003c/strong\u003e We do not verify your identity or location. Each time you use the Services you confirm that this section 2 is true for you. We may block access from any address, device or network at our discretion.\u003c/p\u003e\n\u003ch2\u003e3. What the Services are\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e3.1 What you can do.\u003c/strong\u003e The Services let you deposit supported assets from your own wallet into the Pool, hold a private balance, transfer privately to other NullMask accounts, swap assets inside the Pool, and withdraw to an Ethereum address.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.2 Network and assets.\u003c/strong\u003e The Services work on Ethereum mainnet only. You can use only the assets shown as supported in the application. We may add or remove supported assets at any time.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.3 Where your assets are.\u003c/strong\u003e Assets you deposit are held by the Pool smart contract, together with the assets of other users. They are not held in an account with us. We do not hold your wallet's private key.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.4 What we are not.\u003c/strong\u003e We are not a bank, exchange, broker, payment institution, investment adviser or trustee. We do not hold deposits in the banking sense, and your assets in the Pool are not protected by any deposit guarantee or investor compensation scheme.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.5 Blockchain transactions.\u003c/strong\u003e Operations are executed by smart contracts on a public blockchain. Once confirmed, they cannot be reversed by you or by us.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.6 New software.\u003c/strong\u003e The Services are newly launched. Features, limits and supported assets can change, and parts of the Services may be unavailable from time to time.\u003c/p\u003e\n\u003ch2\u003e4. Your wallet and your account keys\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e4.1 Your wallet.\u003c/strong\u003e You need a compatible self-custody Ethereum wallet. Wallets controlled by a smart contract cannot hold a private balance.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.2 Your wallet key is the only spending key.\u003c/strong\u003e Every transfer, swap and withdrawal must be signed by your wallet. We never receive your wallet's private key or recovery phrase. Our servers cannot create an operation for you without your wallet's signature. They do set the amount of the network and service fee for each operation, as section 7.3 explains. This does not limit the contract-level powers described in section 8.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.3 No recovery.\u003c/strong\u003e If you lose your wallet's private key or recovery phrase, nobody can spend your assets in the Pool. We cannot recover or replace them.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.4 Account keys.\u003c/strong\u003e When you first use the Services, your wallet signs a message. Our servers use that signature to create viewing and receiving keys for your NullMask account, and they keep those keys. The keys let our servers read your private balance and history. They do not allow spending. Section 9 and the Privacy Policy explain what this means for your privacy.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.5 Registration.\u003c/strong\u003e Your account must be registered on Ethereum before it can receive assets. Registration is a transaction from your wallet, and you pay its network gas.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.6 NullMask network in your wallet.\u003c/strong\u003e The application adds a custom network to your wallet. Requests on that network go to our servers, not directly to Ethereum. The network settings saved in your wallet contain an access credential. Keep them confidential.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.7 Your responsibility.\u003c/strong\u003e You are responsible for the security of your wallet, devices and browser, and for every operation signed with your wallet.\u003c/p\u003e\n\u003ch2\u003e5. Deposits and screening\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e5.1 How a deposit works.\u003c/strong\u003e You send a deposit from your own wallet to the Pool and pay the network gas. With each deposit you also add an amount of ETH to cover the gas for crediting it. The part that is not kept under section 7.4 is returned to the depositing address.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.2 Pending deposits.\u003c/strong\u003e A deposit you send to the Pool is first recorded as pending. A pending deposit is not part of your private balance and cannot be transferred, swapped or withdrawn privately.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.3 Screening.\u003c/strong\u003e Before a deposit is credited, we screen the depositing address and addresses connected with the deposit, such as the sender of the transaction and recent sources of the funds. We use public sanctions lists, public blockchain data and a third-party blockchain analytics provider. Screening is carried out on wallet addresses. We do not ask for your identity.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.4 Waiting period.\u003c/strong\u003e A deposit may wait before it is credited. The wait ranges from none to 24 hours or more. It can be longer if a check cannot be completed, for example because a data provider is unavailable.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.5 Outcomes.\u003c/strong\u003e After screening, a deposit is credited to your private balance, refused before you send it, returned to the depositing address, or left pending. We decide at our sole discretion. For legal and security reasons we may not tell you why.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.6 Taking a deposit back.\u003c/strong\u003e While a deposit is pending, you can take it back from the depositing address. It is returned to that address only. You pay the network gas for this transaction. You can do this even while the Pool is paused.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.7 Returns.\u003c/strong\u003e A returned deposit goes only to the address it came from. We may deduct the network cost of the return and, if we introduce one, a screening fee of up to 1% of the deposit. If that address cannot receive the assets, the deposit can stay pending indefinitely. Do not deposit from an exchange or any other address you do not control.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.8 No expiry.\u003c/strong\u003e A pending deposit stays pending until it is credited, returned or taken back.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.9 Minimums and limits.\u003c/strong\u003e Each supported asset has a minimum deposit amount, which the Pool enforces. We may set maximum amounts and overall limits at any time.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.10 Review.\u003c/strong\u003e If you believe a deposit was refused or held in error, write to \u003ca href=\"mailto:compliance@nullmask.io\"\u003ecompliance@nullmask.io\u003c/a\u003e with the depositing address and the transaction hash. We will consider the request. We are not obliged to change the decision or to reply within a set time.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.11 Later use.\u003c/strong\u003e We may refuse later deposits from, and withdrawals to, an address that did not pass screening.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.12 No guarantee.\u003c/strong\u003e Screening reduces the risk that unlawful assets enter the Pool. It does not guarantee that every asset in the Pool has a lawful origin.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.13 Deposits by authorisation.\u003c/strong\u003e For some deposits the application may offer a different method. You approve the Pool to take the tokens and sign an authorisation, and the tokens stay in your wallet during screening. If the deposit is accepted, we move the authorised amount into the Pool and credit it to your own account only. The authorisation is valid for up to 48 hours, and you can cancel it before it is used.\u003c/p\u003e\n\u003ch2\u003e6. Transfers, swaps and withdrawals\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e6.1 How these operations work.\u003c/strong\u003e You sign each operation with your wallet. Our servers prepare the cryptographic proof, and our relayer submits the operation to Ethereum and pays the network gas. You pay the network and service fee described in section 7 in ETH from your private balance.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.2 Dependence on our servers.\u003c/strong\u003e These operations need our servers. The application offers no way to carry them out without them. Doing so would require technical tools that we do not provide.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.3 Refusal and delay.\u003c/strong\u003e We may refuse, delay or queue an operation. Reasons include rate limits, server capacity, a change in fees or network gas, screening, a pause, and legal or security concerns.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.4 Private transfers.\u003c/strong\u003e A private transfer goes to another registered NullMask account. If the recipient address is not registered, the operation is carried out as a withdrawal and is public.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.5 Swaps.\u003c/strong\u003e Swaps inside the Pool are executed through a third-party decentralised exchange protocol, currently Uniswap V2. You choose the slippage tolerance. That protocol charges its own fee, and the price can move before your swap is executed.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.6 Withdrawals.\u003c/strong\u003e A withdrawal sends assets from the Pool to an Ethereum address. The recipient address, the asset, the amount, the network and service fee and the time are public. We screen the recipient address and may refuse to send to it.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.7 Scheduled withdrawals.\u003c/strong\u003e The application may offer withdrawals that are sent immediately and withdrawals that are sent at a scheduled time together with those of other users. A scheduled withdrawal can be moved to a later time. If it cannot be sent within the retry period, it is cancelled and the assets stay in your private balance.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.8 Check the details.\u003c/strong\u003e You are responsible for the recipient address, asset and amount of every operation. Assets sent to a wrong address cannot be recovered.\u003c/p\u003e\n\u003ch2\u003e7. Fees\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e7.1 Protocol fee.\u003c/strong\u003e We charge a protocol fee on deposits and on withdrawals. Each fee is at most 1% of the amount. The current rates are shown in the application before you confirm.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7.2 Rate that applies to a deposit.\u003c/strong\u003e The deposit fee is charged when the deposit is credited, at the rate in force at that moment.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7.3 Network and service fee.\u003c/strong\u003e Transfers, swaps and withdrawals carry a network and service fee. It covers the network gas our relayer pays and our cost of running the Services. Our servers set its amount, and it may be higher than the actual network gas. The difference is not refunded. For an immediate operation the fee is shown before you confirm. For a scheduled withdrawal the application shows a maximum, the fee is set when the withdrawal is sent, and the unused part of the maximum stays in your private balance.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7.4 Gas amount added to deposits.\u003c/strong\u003e From the ETH you add to a deposit under section 5.1 we keep the gas for crediting and an amount towards the cost of screening. The rest is returned.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7.5 Other costs.\u003c/strong\u003e You pay the Ethereum network gas for transactions you send from your own wallet. Third-party protocols, such as the exchange protocol used for swaps, charge their own fees.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7.6 Changes.\u003c/strong\u003e We may change fee rates, and how the network and service fee is calculated, at any time and without notice. The protocol fee stays within the 1% limit in section 7.1. A new rate applies to operations completed after the change. A withdrawal you signed before a change may fail and need to be signed again.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7.7 No refunds.\u003c/strong\u003e Fees are not refundable, except where these Terms say otherwise.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7.8 Taxes.\u003c/strong\u003e You are responsible for any taxes that arise from your use of the Services.\u003c/p\u003e\n\u003ch2\u003e8. Our control over the Services\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e8.1 We control the Pool contracts.\u003c/strong\u003e The Pool contracts are upgradeable and are controlled by keys that we hold. NullMask is not a decentralised or community-governed protocol.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e8.2 What we can do.\u003c/strong\u003e Using those keys, we can:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003eupgrade or replace the logic of the Pool contracts, including how proofs are verified;\u003c/li\u003e\u003cli\u003epause deposits, private transfers and swaps;\u003c/li\u003e\u003cli\u003epause withdrawals;\u003c/li\u003e\u003cli\u003echange fees within the limits in section 7, minimum and maximum amounts, and supported assets;\u003c/li\u003e\u003cli\u003echange the rules and providers used for screening; and\u003c/li\u003e\u003cli\u003eappoint or replace the addresses that credit deposits and relay operations.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e8.3 No notice period.\u003c/strong\u003e These changes can take effect immediately and without notice. An upgrade can change any rule of the Pool, including the rules that decide who can move assets.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e8.4 Pauses.\u003c/strong\u003e While withdrawals are paused, you cannot withdraw or swap your private balance. We use pauses for security, legal or operational reasons. These Terms set no maximum length for a pause.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e8.5 Changes to the Services.\u003c/strong\u003e We may change, suspend or stop the Services, or any part of them, at any time. If we decide to stop the Services, we will try, where lawful and reasonably practicable, to give notice in the application and time to withdraw.\u003c/p\u003e\n\u003ch2\u003e9. What is private and what is not\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e9.1 Public on the blockchain.\u003c/strong\u003e The following is visible to everyone, permanently:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003edeposits: the depositing address, the receiving account, the asset and the amount;\u003c/li\u003e\u003cli\u003ewithdrawals: the recipient address, the asset, the amount, the network and service fee and the time;\u003c/li\u003e\u003cli\u003eswaps: the assets and the amounts, but not who made the swap; and\u003c/li\u003e\u003cli\u003eregistration: your wallet address and its NullMask public key.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003ePrivate transfers inside the Pool do not show the sender, the recipient or the amount on the blockchain.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e9.2 Visible to us.\u003c/strong\u003e Our servers process your account keys. We can therefore see your private balance and your history inside the Pool, and we can link your deposits to your transfers and withdrawals. The Services protect your activity from outside observers of the blockchain, not from us. The Privacy Policy explains how we handle this data and when we may disclose it.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e9.3 Linking by others.\u003c/strong\u003e Other people may be able to connect a withdrawal to a deposit from public data. The risk depends on the amounts and timing you choose, on whether you reuse addresses, on what you do after you withdraw, and on how many other people use the Pool at the same time.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e9.4 No guarantee.\u003c/strong\u003e Estimates, simulations and guidance in the application are illustrations, not guarantees. We do not promise anonymity or that your activity cannot be traced.\u003c/p\u003e\n\u003ch2\u003e10. Risks you accept\u003c/h2\u003e\n\u003cp\u003eBy using the Services you accept the following risks. Any of them can lead to the loss of some or all of your assets.\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003eNew and unaudited software.\u003c/strong\u003e At the Effective Date the Pool contracts have not been independently audited. A later audit would not guarantee that they are free of defects.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eTechnology.\u003c/strong\u003e Smart contracts, zero-knowledge proof systems and the software around them can contain errors or be attacked.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eControl keys.\u003c/strong\u003e If the keys that control the Pool contracts are lost, stolen or misused, the Pool and the assets in it can be affected.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eYour wallet.\u003c/strong\u003e If you lose your wallet's private key, your assets in the Pool are lost.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eOur servers.\u003c/strong\u003e If our servers are unavailable, you may be unable to transfer, swap or withdraw. If they are breached, your account keys and history could be exposed.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eStablecoin issuers.\u003c/strong\u003e The issuer of a token can freeze an address, including the Pool or your own address. Frozen tokens cannot leave the Pool or be returned to you, and we cannot reverse an issuer's freeze.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eScreening.\u003c/strong\u003e Deposits and withdrawals can be delayed, refused or returned, including by mistake.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eThird parties.\u003c/strong\u003e The Services rely on data, network and exchange providers that we do not control. Their failures can delay or block your operations.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eNetwork.\u003c/strong\u003e Ethereum gas costs change, the network can be congested, and confirmed transactions cannot be reversed.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eOther platforms.\u003c/strong\u003e Exchanges and other service providers may question, delay or refuse assets that have passed through a privacy protocol.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eLaw and regulation.\u003c/strong\u003e Privacy tools are under legal and regulatory scrutiny. New rules or enforcement action could restrict the Services or your ability to use them.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eMarket.\u003c/strong\u003e The value of digital assets can fall sharply while they are in the Pool.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e11. Prohibited use\u003c/h2\u003e\n\u003cp\u003eYou must not use the Services to do any of the following, or help anyone else to do so:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003elaunder money, finance terrorism or evade sanctions;\u003c/li\u003e\u003cli\u003edeposit or move assets that come from theft, hacking, fraud, ransomware or any other crime;\u003c/li\u003e\u003cli\u003edeposit assets that you do not lawfully own or control;\u003c/li\u003e\u003cli\u003ebreak any law that applies to you;\u003c/li\u003e\u003cli\u003eact for a person who is not allowed to use the Services under section 2;\u003c/li\u003e\u003cli\u003eget around screening, limits or other restrictions, for example by splitting amounts or using intermediary addresses;\u003c/li\u003e\u003cli\u003eattack, probe, overload or disrupt the Services or the Pool, or exploit an error in them;\u003c/li\u003e\u003cli\u003eaccess the Services by automated means in a way that places an unreasonable load on them; or\u003c/li\u003e\u003cli\u003egive false information to us or impersonate another person.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e12. Third-party services\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e12.1\u003c/strong\u003e The Services work together with things we do not control. These include your wallet software, the Ethereum network, the exchange protocol used for swaps, token issuers, network node providers and data providers.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e12.2\u003c/strong\u003e We are not responsible for third-party services, for their availability or security, or for any loss they cause. Your use of them is governed by their own terms.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e12.3\u003c/strong\u003e Links to third-party websites are provided for convenience. A link is not an endorsement.\u003c/p\u003e\n\u003ch2\u003e13. No advice and no token rights\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e13.1 No advice.\u003c/strong\u003e Nothing in the Services is financial, investment, legal or tax advice. You decide for yourself whether and how to use the Services.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e13.2 No fiduciary duty.\u003c/strong\u003e We owe you no fiduciary duty. Our only duties to you are those stated in these Terms.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e13.3 Tokens.\u003c/strong\u003e Any token that uses the NullMask or MASK name is not part of the Services. Holding it gives no right to use the Services, no claim on the Pool or on fees, and no rights against us under these Terms. These Terms do not govern buying, selling or holding any such token. Any mention of, or link to, such a token on our website is for information only and is not advice or a recommendation.\u003c/p\u003e\n\u003ch2\u003e14. Intellectual property\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e14.1 Ownership.\u003c/strong\u003e The Services, including the software, text, design and the NullMask name and logo, belong to us or to third parties whose material we use. Parts of the software may be released under an open-source licence. Those parts are governed by that licence.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e14.2 Your licence.\u003c/strong\u003e While you comply with these Terms, you may use the Services for their intended purpose. This permission is personal, non-exclusive and can be withdrawn.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e14.3 Feedback.\u003c/strong\u003e If you send us ideas or suggestions, we may use them freely and without payment to
