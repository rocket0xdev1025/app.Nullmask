4426-b9fc9f33d3672179.js\",\"7177\",\"static/chunks/app/layout-62ec2e93447dee44.js\"],\"Toaster\"]\n29:I[35023,[],\"IconMark\"]\n:HL[\"/_next/static/media/028c0d39d2e8f589-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n:HL[\"/_next/static/media/5b01f339abf2f1a5.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n:HL[\"/_next/static/css/066057595432ca12.css\",\"style\"]\n:HL[\"/_next/static/css/1c61e4a2caff8b55.css\",\"style\"]\n:HL[\"/_next/static/css/d6787b897de50e8b.css\",\"style\"]\n:HL[\"/_next/static/css/cf95c1394dfbbc38.css\",\"style\"]\n:HL[\"/_next/static/css/13aa35b8e5b1d659.css\",\"style\"]\n:HL[\"/_next/static/css/e9ab56f710070038.css\",\"style\"]\n7:T48d1,"])</script><script>self.__next_f.push([1,"\u003ch1\u003eNullMask Privacy Policy\u003c/h1\u003e\n\u003cp\u003eEffective date: Oct 1, 2026\u003c/p\u003e\n\u003cp\u003eThis policy explains what data NullMask handles when you use the Services, why, and what choices you have. Words defined in the Terms of Use have the same meaning here.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIn short\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli\u003eWe do not ask who you are. There is no sign-up, no identity check and no email requirement.\u003c/li\u003e\u003cli\u003eWe do process wallet data: addresses, signatures, balances and operations.\u003c/li\u003e\u003cli\u003eOur servers hold the keys that read your private balance and history. We can see your activity inside the Pool. Outside observers see only the public data listed in section 6.\u003c/li\u003e\u003cli\u003eDeposits and withdrawal recipients are screened by wallet address.\u003c/li\u003e\u003cli\u003eThe application contains no analytics or advertising trackers. The website nullmask.io uses Google Analytics, and only if you accept it. We do not sell data.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e1. Who is responsible\u003c/h2\u003e\n\u003cp\u003eThe company that operates the Services (the \u0026quot;Operator\u0026quot;) is the controller of the personal data described here. It is established outside the European Economic Area and the United Kingdom. We will give its full legal details to anyone who needs them to exercise their rights, and to any competent authority, on request.\u003c/p\u003e\n\u003cp\u003eFor any question or request about your data, write to \u003ca href=\"mailto:compliance@nullmask.io\"\u003ecompliance@nullmask.io\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003e2. What we can see inside the Pool\u003c/h2\u003e\n\u003cp\u003eNullMask works like a private network for your wallet: it is designed to make your activity hard for outside observers to follow, but the operator of the network can see it.\u003c/p\u003e\n\u003cp\u003eTo show your private balance and prepare your operations, our servers create and keep the viewing and receiving keys for your account. They are created from a message your wallet signs when you first use the Services. With these keys our servers read your balance and your history inside the Pool, and prepare the cryptographic proofs for your operations.\u003c/p\u003e\n\u003cp\u003eThis means that we can see your private balance, your private transfers, swaps and withdrawals, and which deposits fund them.\u003c/p\u003e\n\u003cp\u003eWe do not hold your wallet's private key. Every transfer, swap and withdrawal must be signed by your wallet.\u003c/p\u003e\n\u003ch2\u003e3. Data we collect\u003c/h2\u003e\n\u003cdiv class=\"legal-table\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eData\u003c/th\u003e\u003cth\u003eWhat it includes\u003c/th\u003e\u003cth\u003eWhy we use it\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eAccount keys\u003c/td\u003e\u003ctd\u003eYour wallet address; the viewing and receiving keys created from your wallet's signature; session and wallet access tokens. Your wallet's signature is sent to our servers each time you sign in. It is used to create the keys and tokens and is not itself stored.\u003c/td\u003e\u003ctd\u003eTo show your balance, prepare your operations and keep you signed in\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePrivate activity\u003c/td\u003e\u003ctd\u003eYour balance inside the Pool; records of your transfers, swaps and withdrawals with recipient, asset and amount; the operations your wallet signed\u003c/td\u003e\u003ctd\u003eTo provide the Services\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDeposit and screening records\u003c/td\u003e\u003ctd\u003eDepositing address, receiving account, asset, amount and transaction hashes; public blockchain history of the depositing address that shows where the funds came from; checks you run before depositing; the screening result and our decision\u003c/td\u003e\u003ctd\u003eTo screen deposits, protect the Pool and handle disputes\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRecipient checks\u003c/td\u003e\u003ctd\u003eThe address you withdraw to and the screening result\u003c/td\u003e\u003ctd\u003eTo screen withdrawals\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNetwork data\u003c/td\u003e\u003ctd\u003eYour IP address and the time of your requests. We use IP addresses for rate limits in server memory and do not save them in our databases. For some limits an IP address is held together with a wallet address in memory for up to one day. Logs of failed requests contain the IP address.\u003c/td\u003e\u003ctd\u003eTo prevent abuse and fix faults\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eError reports\u003c/td\u003e\u003ctd\u003eTechnical log lines and error messages from our servers. Some contain a wallet address.\u003c/td\u003e\u003ctd\u003eTo find and fix faults\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWebsite visits\u003c/td\u003e\u003ctd\u003eWhen you visit nullmask.io or our documentation, the hosting provider records standard server logs: IP address, browser type, referring page and pages viewed\u003c/td\u003e\u003ctd\u003eTo deliver and secure the websites\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWebsite analytics\u003c/td\u003e\u003ctd\u003eIf you accept analytics cookies on nullmask.io, Google Analytics records the pages you view, how you reached the site, your device and browser type, your approximate location and an identifier kept in a cookie. It is loaded through Google Tag Manager and does not run in the application.\u003c/td\u003e\u003ctd\u003eTo understand how the website is used and improve it\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMessages\u003c/td\u003e\u003ctd\u003eYour email address and what you write, if you contact us\u003c/td\u003e\u003ctd\u003eTo answer you\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e4. What we do not collect\u003c/h2\u003e\n\u003cul\u003e\u003cli\u003eYour wallet's private key or recovery phrase.\u003c/li\u003e\u003cli\u003eYour name, identity documents, phone number or address. We do not run identity checks.\u003c/li\u003e\u003cli\u003eYour email address, unless you write to us.\u003c/li\u003e\u003cli\u003eBank or card details.\u003c/li\u003e\u003cli\u003eAnalytics, advertising or session-recording data in the application. The application contains no such trackers. The website nullmask.io uses Google Analytics, as sections 3 and 9 explain. Wallet connection tools you choose, and the companies that host our websites, may collect technical data of their own.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e5. Screening\u003c/h2\u003e\n\u003cp\u003eWe screen wallet addresses before a deposit is credited and before a withdrawal is sent. Screening is about addresses, not people: we hold no identity data to check.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat we check.\u003c/strong\u003e The depositing address, the sender of the deposit transaction, the receiving account if it is not the depositor's, recent sources of the deposited funds, and the address you withdraw to.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat we check against.\u003c/strong\u003e Public sanctions lists, public blockchain data, and risk data from a third-party blockchain analytics provider.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat we send to providers.\u003c/strong\u003e The analytics provider receives wallet addresses only. It does not receive amounts, your IP address, device data or any NullMask account identifier. A blockchain data provider receives the depositing address so that we can read its public transaction history. We may ask the analytics provider to keep monitoring a depositing address after the deposit is credited. The provider offers no way to end that monitoring once it has started. Providers handle the addresses they receive under their own terms.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat we keep.\u003c/strong\u003e A summary of the result and our decision, as described in section 3; a saved result for each screened address, so that a check is not repeated without need; a record of each decision; and a list of addresses we have blocked.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat we tell you.\u003c/strong\u003e The application shows whether a deposit or a recipient was accepted. For legal and security reasons we do not show the detailed reason.\u003c/p\u003e\n\u003ch2\u003e6. Public blockchain data\u003c/h2\u003e\n\u003cp\u003eSome data is written to the Ethereum blockchain when you use the Services. It is public and permanent, and nobody, including us, can change or delete it. This covers:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003edeposits: the depositing address, the receiving account, the asset and the amount;\u003c/li\u003e\u003cli\u003ewithdrawals: the recipient address, the asset, the amount, the network and service fee and the time;\u003c/li\u003e\u003cli\u003eswaps: the assets and the amounts; and\u003c/li\u003e\u003cli\u003eregistration: your wallet address and its NullMask public key.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003ePrivate transfers inside the Pool do not show the sender, the recipient or the amount on the blockchain.\u003c/p\u003e\n\u003ch2\u003e7. Why we use your data\u003c/h2\u003e\n\u003cp\u003eWe use your data only for the purposes below. The last column gives the legal basis for users in the European Economic Area and the United Kingdom.\u003c/p\u003e\n\u003cdiv class=\"legal-table\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePurpose\u003c/th\u003e\u003cth\u003eData used\u003c/th\u003e\u003cth\u003eLegal basis\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eProvide the Services: show your balance, prepare and relay your operations, keep you signed in\u003c/td\u003e\u003ctd\u003eAccount keys, private activity, network data\u003c/td\u003e\u003ctd\u003ePerformance of our contract with you\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eScreen deposits and withdrawals, and keep unlawful funds out of the Pool\u003c/td\u003e\u003ctd\u003eDeposit and screening records, recipient checks\u003c/td\u003e\u003ctd\u003eOur legitimate interest in protecting the Pool and its users and in respecting sanctions rules; a legal obligation where one applies\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eKeep the Services secure, prevent abuse and fix faults\u003c/td\u003e\u003ctd\u003eNetwork data, error reports\u003c/td\u003e\u003ctd\u003eOur legitimate interest in a secure and working service\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAnswer your messages and requests\u003c/td\u003e\u003ctd\u003eMessages\u003c/td\u003e\u003ctd\u003eOur legitimate interest in responding to you\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUnderstand how the website nullmask.io is used and improve it\u003c/td\u003e\u003ctd\u003eWebsite analytics\u003c/td\u003e\u003ctd\u003eYour consent, which you can withdraw at any time\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHandle disputes and respond to binding legal orders\u003c/td\u003e\u003ctd\u003eAny data above, as far as needed\u003c/td\u003e\u003ctd\u003eOur legitimate interest in defending legal claims; a legal obligation where one applies\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eWe do not use your data for advertising or marketing, and we do not sell it.\u003c/p\u003e\n\u003ch2\u003e8. Who receives data\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eProviders that work for us.\u003c/strong\u003e Each receives only what it needs.\u003c/p\u003e\n\u003cdiv class=\"legal-table\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eProvider type\u003c/th\u003e\u003cth\u003eWhat it receives\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eServer hosting\u003c/td\u003e\u003ctd\u003eThe data stored and processed on our servers\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWebsite and documentation hosting\u003c/td\u003e\u003ctd\u003eVisitor logs of nullmask.io and the documentation site\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWebsite analytics (Google)\u003c/td\u003e\u003ctd\u003eAnalytics data from your visits to nullmask.io, if you accept analytics cookies\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBlockchain node providers\u003c/td\u003e\u003ctd\u003eThe operations and blockchain queries our servers send, which include wallet addresses. They do not receive your IP address from us.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBlockchain analytics provider\u003c/td\u003e\u003ctd\u003eWallet addresses, as described in section 5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBlockchain data provider\u003c/td\u003e\u003ctd\u003eDepositing addresses, to read their public history\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eError monitoring\u003c/td\u003e\u003ctd\u003eError reports from our servers. Some contain a wallet address.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eEmail hosting\u003c/td\u003e\u003ctd\u003eMessages you send us\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eServices your browser contacts directly.\u003c/strong\u003e When you use the application, your browser connects to some third parties itself. They see your IP address and act under their own privacy terms.\u003c/p\u003e\n\u003cul\u003e\u003cli\u003eA public Ethereum node endpoint. The application uses it to read blockchain data, including a search for deposits made from your address.\u003c/li\u003e\u003cli\u003eWallet connection services, if you choose a wallet that relies on one. They receive connection data and your wallet address.\u003c/li\u003e\u003cli\u003eHosts of token, wallet and network logos shown in the application.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eAuthorities.\u003c/strong\u003e We disclose data to a court, regulator or law enforcement body only where a binding legal order or applicable law requires it. We do not share data with them voluntarily.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSuccessor.\u003c/strong\u003e If another company takes over the operation of the Services, the data passes to it and stays subject to this policy.\u003c/p\u003e\n\u003ch2\u003e9. Cookies and browser storage\u003c/h2\u003e\n\u003cp\u003eThe application uses only cookies and browser storage that it needs to work. It has no analytics or advertising cookies. The website nullmask.io uses Google Analytics cookies, and only if you accept them in the cookie banner on that site.\u003c/p\u003e\n\u003cdiv class=\"legal-table\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eItem\u003c/th\u003e\u003cth\u003eWhat it holds\u003c/th\u003e\u003cth\u003eHow long\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eWallet connection cookies (\u003ccode\u003ewagmi.*\u003c/code\u003e)\u003c/td\u003e\u003ctd\u003eThe connected wallet addresses, the network and the type of wallet. They are sent to our application server with each page request.\u003c/td\u003e\u003ctd\u003eUntil you close the browser\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSession cookie (\u003ccode\u003e__Host-nullmask_access_token\u003c/code\u003e)\u003c/td\u003e\u003ctd\u003eA token that signs your browser in to your private balance. Scripts on the page cannot read it. The token is created from your wallet's signature and stays valid on our servers after the cookie is gone.\u003c/td\u003e\u003ctd\u003eUntil you close the browser\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDeposit list (local storage)\u003c/td\u003e\u003ctd\u003eYour deposits and deposit requests you signed: depositing address, your account, asset, amount, transaction hash, status and the last block checked. This record links your depositing address to your account.\u003c/td\u003e\u003ctd\u003eUntil you clear site data\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDeposit status session (local storage)\u003c/td\u003e\u003ctd\u003eA token that lets you view details of your own deposits without signing again\u003c/td\u003e\u003ctd\u003eThe token is valid for up to 24 hours. The entry stays until you clear site data.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePreferences (local storage)\u003c/td\u003e\u003ctd\u003eTheme, viewing mode and whether you have seen the introduction\u003c/td\u003e\u003ctd\u003eUntil you clear site data\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRecent operations (session storage)\u003c/td\u003e\u003ctd\u003eYour last few operations, the selected withdrawal mode and dismissed notices\u003c/td\u003e\u003ctd\u003eUntil you close the tab\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAnalytics cookies on nullmask.io (_ga and _ga_\u0026lt;ID\u0026gt;)\u003c/td\u003e\u003ctd\u003eAn identifier that lets Google Analytics tell one visitor's visits apart. Set only if you accept analytics cookies.\u003c/td\u003e\u003ctd\u003eUp to 2 years\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eWebsite analytics.\u003c/strong\u003e On nullmask.io, Google Tag Manager loads Google Analytics only after you accept analytics cookies in the banner. Until you accept, no analytics cookies are set. You can change your choice at any time through the cookie settings link on that site, or block these cookies in your browser. Analytics does not run in the application at app.nullmask.io.\u003c/p\u003e\n\u003cp\u003eYour wallet also saves the settings of the NullMask network, which contain an access credential. The credential gives read access to your balance and your own operations, and it does not expire. The settings stay in your wallet until you remove the network.\u003c/p\u003e\n\u003cp\u003eWallet connection tools from third parties may store their own data in your browser if you choose them. Our documentation site is hosted by a third party, which may set its own cookies.\u003c/p\u003e\n\u003cp\u003eOn a shared device, clear the site data for app.nullmask.io and remove the NullMask network from your wallet when you finish.\u003c/p\u003e\n\u003ch2\u003e10. How long we keep data\u003c/h2\u003e\n\u003cdiv class=\"legal-table\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eData\u003c/th\u003e\u003cth\u003eHow long we keep it\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eAccount keys and private activity\u003c/td\u003e\u003ctd\u003eWhile you use the Services, and until you ask us to delete them\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDeposit and screening records, and the list of blocked addresses\u003c/td\u003e\u003ctd\u003e5 years after the deposit or check\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRecipient check results\u003c/td\u003e\u003ctd\u003e24 hours\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIP addresses used for rate limits\u003c/td\u003e\u003ctd\u003eIn server memory, for up to one day\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLogs of failed requests and error reports\u003c/td\u003e\u003ctd\u003eUp to 90 days\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMessages you send us\u003c/td\u003e\u003ctd\u003e12 months after our last contact\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWebsite and documentation visitor logs\u003c/td\u003e\u003ctd\u003eThe hosting provider's standard period\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWebsite analytics data\u003c/td\u003e\u003ctd\u003eUp to 14 months in Google Analytics\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBlockchain data\u003c/td\u003e\u003ctd\u003ePermanent. It cannot be deleted.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eIf you ask us to delete your account keys and private activity and later sign in again, they are recreated from your wallet's signature and public blockchain data.\u003c/p\u003e\n\u003cp\u003eWe may keep data longer where a law requires it or where we need it for a legal claim.\u003c/p\u003e\n\u003ch2\u003e11. Where data is processed and how it is protected\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eLocation.\u003c/strong\u003e The servers that run the application, hold account keys and carry out screening are located in Finland, in the European Union.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTransfers.\u003c/strong\u003e The Operator is established outside the European Economic Area and the United Kingdom, and some of our providers are in the United States and other countries. Your data may therefore be accessed from, or sent to, countries whose data protection laws differ from yours. Those laws may give your data less protection than the law of your own country.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSecurity.\u003c/strong\u003e Connections to the Services are encrypted in transit. Access to our servers and to the data on them is restricted to authorised personnel. Administrative actions on the screening system require cryptographic authorisation and are recorded.\u003c/p\u003e\n\u003cp\u003eNo system is perfectly secure. If our servers were breached, the data described in section 3 could be exposed.\u003c/p\u003e\n\u003ch2\u003e12. Your rights\u003c/h2\u003e\n\u003cp\u003eDepending on where you live, you may have the right to:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003eget a copy of the data we hold about you;\u003c/li\u003e\u003cli\u003ehave inaccurate data corrected;\u003c/li\u003e\u003cli\u003ehave your data deleted;\u003c/li\u003e\u003cli\u003eobject to our use of your data, ask us to restrict it, or withdraw a consent you gave, such as consent to website analytics;\u003c/li\u003e\u003cli\u003ereceive your data in a portable format; and\u003c/li\u003e\u003cli\u003ecomplain to the data protection authority of your country.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eHow to make a request.\u003c/strong\u003e Write to \u003ca href=\"mailto:compliance@nullmask.io\"\u003ecompliance@nullmask.io\u003c/a\u003e. Because we do not know who you are, we will ask you to prove control of the wallet address by signing a message with it. We do not charge for requests.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLimits.\u003c/strong\u003e We cannot delete or change data on the blockchain. We may keep screening records after a deletion request where we need them to respect sanctions rules or to defend a legal claim.\u003c/p\u003e\n\u003ch2\u003e13. Automated decisions\u003c/h2\u003e\n\u003cp\u003eScreening decisions are made automatically from address risk data and the public history of the address. In some cases a deposit may be passed to a person for review. A decision can delay, refuse or return a deposit, or refuse a withdrawal recipient. You can ask us to look at a decision by writing to \u003ca href=\"mailto:compliance@nullmask.io\"\u003ecompliance@nullmask.io\u003c/a\u003e with the wallet address and the transaction hash. A person will consider the request. Where we agree, we can change how later deposits from that address are treated. A deposit that is still pending can be taken back from the depositing address.\u003c/p\u003e\n\u003ch2\u003e14. Children\u003c/h2\u003e\n\u003cp\u003eThe Services are for people aged 18 or over. We do not knowingly process data of children.\u003c/p\u003e\n\u003ch2\u003e15. Changes to this policy\u003c/h2\u003e\n\u003cp\u003eWe may update this policy. We will post the new version with a new effective date. For important changes we will also show a notice in the application.\u003c/p\u003e\n\u003ch2\u003e16. Contact\u003c/h2\u003e\n\u003cul\u003e\u003cli\u003ePrivacy requests and screening reviews: \u003ca href=\"mailto:compliance@nullmask.io\"\u003ecompliance@nullmask.io\u003c/a\u003e\u003c/li\u003e\u003cli\u003eLegal notices: \u003ca href=\"mailto:legal@nullmask.io\"\u003elegal@nullmask.io\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"6tvlXZso5K9td_in6gNl8\",\"p\":\"\",\"c\":[\"\",\"privacy\"],\"i\":false,\"f\":[[[\"\",{\"children\":[\"privacy\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],[\"\",[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/066057595432ca12.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/1c61e4a2caff8b55.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/d6787b89
